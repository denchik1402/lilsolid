name: Deploy lilsolid.ru

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 12m
          script: |
            set -e
            set -o pipefail
            APP_DIR=/home/lilstore/lilsolid
            SERVICE=lilsolid
            trap 'systemctl restart "$SERVICE" 2>/dev/null || systemctl start "$SERVICE" 2>/dev/null || true' EXIT

            echo "=== 1. chown ==="
            rm -f "$APP_DIR/gunicorn.ctl" 2>/dev/null || true
            find "$APP_DIR" -xtype l -delete 2>/dev/null || true
            chown -hR lilstore:lilstore "$APP_DIR"

            echo "=== 2. git pull ==="
            rm -f /home/lilstore/.gitconfig.lock 2>/dev/null || true
            sudo -u lilstore bash -c "cd $APP_DIR && git -c safe.directory=$APP_DIR fetch origin main && git -c safe.directory=$APP_DIR reset --hard origin/main && git -c safe.directory=$APP_DIR clean -fd alembic/versions/"

            echo "=== 3. pip install ==="
            sudo -u lilstore bash -c "cd $APP_DIR && source venv/bin/activate && pip install -r requirements.txt --quiet"

            echo "=== 4. light DB repair (no full catalog sync on every deploy) ==="
            systemctl stop "$SERVICE" || true
            sudo -u lilstore bash -c "cd $APP_DIR && source venv/bin/activate && python3 repair_schema.py" || true

            echo "=== 5. static perms ==="
            chown -R www-data:www-data "$APP_DIR/static" 2>/dev/null || true
            find "$APP_DIR/static" -type d -exec chmod 755 {} \; 2>/dev/null || true
            find "$APP_DIR/static" -type f -exec chmod 644 {} \; 2>/dev/null || true
            for d in banners products blog categories; do
              mkdir -p "$APP_DIR/static/images/$d"
              chown -R lilstore:lilstore "$APP_DIR/static/images/$d"
            done

            echo "=== 6. nginx + systemd ==="
            if [[ -f /etc/letsencrypt/live/lilsolid.ru/fullchain.pem ]]; then
              cp "$APP_DIR/deploy/nginx-lilsolid.conf" /etc/nginx/sites-available/lilsolid
            else
              cp "$APP_DIR/deploy/nginx-lilsolid-http.conf" /etc/nginx/sites-available/lilsolid
            fi
            ln -sf /etc/nginx/sites-available/lilsolid /etc/nginx/sites-enabled/lilsolid
            cp "$APP_DIR/deploy/lilsolid.service" "/etc/systemd/system/${SERVICE}.service"
            systemctl daemon-reload
            nginx -t
            systemctl reload nginx

            echo "=== 7. restart ==="
            systemctl restart "$SERVICE"
            sleep 2
            systemctl is-active "$SERVICE"
            curl -sS -m 8 -o /dev/null -w "home:%{http_code}\n" -L http://127.0.0.1:8000/ || true
            echo "=== Deploy lilsolid (fast) completed ==="
            echo "Tip: for full catalog sync run on server: sudo -u lilstore bash -c 'cd $APP_DIR && source venv/bin/activate && python3 scripts/apply_store_sync.py'"
