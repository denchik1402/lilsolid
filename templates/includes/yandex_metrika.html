{# Яндекс.Метрика только после явного согласия на аналитические cookies (localStorage cookies_accepted=1). #}
<script>
window.dataLayer = window.dataLayer || [];
(function() {
    var metrikaId = {{ yandex_metrika_id }};
    var CONSENT_KEY = 'cookies_accepted';

    function hasAnalyticsConsent() {
        try {
            var v = localStorage.getItem(CONSENT_KEY);
            return v === '1' || v === 'true';
        } catch (e) {
            return false;
        }
    }

    function initMetrika() {
        if (window.__ymLilstoreInit) return;
        window.__ymLilstoreInit = true;
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document, 'script', 'https://mc.yandex.ru/metrika/tag.js?id=' + metrikaId, 'ym');
        ym(metrikaId, 'init', {
            ssr: true,
            webvisor: true,
            clickmap: true,
            ecommerce: "dataLayer",
            referrer: document.referrer,
            url: location.href,
            accurateTrackBounce: true,
            trackLinks: true
        });
    }

    function scheduleInit() {
        if (!hasAnalyticsConsent()) return;
        if (window.requestIdleCallback) {
            requestIdleCallback(initMetrika, {timeout: 4000});
        } else {
            window.addEventListener('load', function() { setTimeout(initMetrika, 500); });
        }
    }

    scheduleInit();
    window.addEventListener('lilstore-analytics-consent', scheduleInit);
})();
</script>
